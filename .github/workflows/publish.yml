name: Publish Python Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show source version
        shell: bash
        run: |
          python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          version = data["project"]["version"]
          print(f"Package version: {version}")
          PY

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          print(data["project"]["version"])
          PY
          )

          echo "Git tag:       $TAG_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: Git tag and package version do not match."
            exit 1
          fi

          echo "Version check: PASS"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Clean old distributions
        shell: bash
        run: |
          rm -rf dist build
          find . -maxdepth 1 -type d -name "*.egg-info" -exec rm -rf {} +

      - name: Build distributions
        run: python -m build

      - name: Show generated distributions
        shell: bash
        run: |
          echo "Generated distributions:"
          ls -lah dist/

      - name: Verify distribution version
        shell: bash
        run: |
          EXPECTED="universal_model-${GITHUB_REF_NAME#v}"

          echo "Expected prefix: $EXPECTED"

          for file in dist/*; do
            echo "Checking: $file"
            case "$file" in
              "$EXPECTED"*) ;;
              *)
                echo "ERROR: Unexpected distribution filename: $file"
                exit 1
                ;;
            esac
          done

          echo "Distribution version check: PASS"

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: universal-model-distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/universal-model/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: universal-model-distributions
          path: dist/

      - name: Show distributions to publish
        shell: bash
        run: |
          echo "Distributions ready for PyPI:"
          ls -lah dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
