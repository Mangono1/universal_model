[build-system]
requires = [
    "setuptools>=68"
]
build-backend = "setuptools.build_meta"

[project]
name = "universal-model"
version = "0.1.0"
description = "Universal neural model framework built on CPUTorch"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Frandika Imam Arifin" }
]
dependencies = [
    "cputorch>=0.5.5"
]

[project.urls]
Homepage = "https://github.com/Mangono1/universal_model"
Repository = "https://github.com/Mangono1/universal_model"

[tool.setuptools.packages.find]
include = ["universal_model*"]
