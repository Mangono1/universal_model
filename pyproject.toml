[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "universal-model"
version = "0.1.0"
description = "A lightweight, CPU-first universal neural model framework built on CPUTorch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Frandika Imam Arifin" },
]

keywords = [
    "neural-network",
    "deep-learning",
    "machine-learning",
    "cpu",
    "cputorch",
    "model-framework",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "cputorch>=0.5.5",
]

[project.urls]
Homepage = "https://github.com/Mangono1/universal_model"
Repository = "https://github.com/Mangono1/universal_model"
Issues = "https://github.com/Mangono1/universal_model/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_model*"]
exclude = [
    "tests*",
    "examples*",
]
